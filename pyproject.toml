[project]
name = "popsim"
version = "0.1.0"
description = "Jev-style typed decisions on Twin-2K-500, with a self-hosted open decision model on Modal"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "modal>=1.6.2",
    "huggingface-hub>=0.30",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2",
    "scipy>=1.13",
    # Required by the Twin-2K-500 converter and scorer, which we run unmodified.
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "pyyaml>=6",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = ["integration: requires the pinned dataset and upstream scoring code (python -m popsim.prepare)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
